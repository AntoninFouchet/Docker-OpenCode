networks:
  public_net:
    internal: false
  internal_net:
    internal: true

services:
  opencode:
    image: opencode-docker:v1 #image du conteneur
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode_dev

    networks:
      - ${DOCKER_NETWORK:-internal_net}

    volumes:
      - ${LOCAL_PROJECTS_PATH}:/app/workspace
    ports:
      - "3000:3000"
    working_dir: /app
    environment:
      # Dossier de travail est workspace par défaut
      - WORKSPACE_DIR=/app/workspace
      # Adresse pour la communication interne
      - OLLAMA_BASE_URL=http://ollama:11434

      # Forcer l'utilisation de Ollama, config Json
      - |
        OPENCODE_CONFIG_CONTENT={
          "enabled_providers": ["ollama"],
          "model": "ollama/qwen2.5-coder:7b",
          "provider": {
            "ollama": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "Ollama",
              "options": {
                "baseURL": "http://ollama:11434/v1"
              },
              "models": {
                "qwen2.5-coder:7b": {
                  "name": "Qwen 2.5 Coder (7B)"
                }
              }
            }
          }
        }        

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_dev
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ${DOCKER_NETWORK:-internal_net}

volumes:
  ollama_data:
