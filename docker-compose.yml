networks:
  # Réseau Public, Seul le Proxy y a accès
  public_net: # Exterieur
    driver: bridge # Va faire la passerelle

  # Réseau Privé, OpenCode est enfermé ici
  private_net:
    internal: true # reste en interne

services:

  proxy: # conteneur proxy
    image: ubuntu/squid:latest
    container_name: proxy
    volumes: # Association du Proxy aux paramètres définit sur le windows
      - ./squid.conf:/etc/squid/squid.conf
    ports:
      - "3128:3128"
    networks:
      - public_net       # Côté Internet
      - private_net  # Côté Interne


  opencode: # conteneur OpenCode
    image:  #image du conteneur
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode
    networks:
      - private_net
    volumes:
      - C:/_ddm/opencode:/agent/shared
    ports:
      - "3000:3000"
    working_dir: /agent
    environment:
      # Proxy
      # Le trafic web passe par proxy
      - HTTP_PROXY=http://proxy:3128
      - HTTPS_PROXY=http://proxy:3128
      # Empeche l'agent de passer par le proxy pour parler à 127.0.0.1 (lui même)et opencode_dev
      - NO_PROXY=localhost,127.0.0.1,opencode
