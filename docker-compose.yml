networks:
  # Réseau Public, Seul le Proxy y a accès
  public_net: # Exterieur
    driver: bridge # Va faire la passerelle

  # Réseau Privé, OpenCode et Ollama sont enfermés ici
  private_net:
    internal: true # reste en interne

services:

  proxy: # conteneur proxy
    image: ubuntu/squid:latest
    container_name: proxy
    volumes: # Association du Proxy aux paramètres définit sur le windows
      - ./squid.conf:/etc/squid/squid.conf
    ports:
      - "3128:3128"
    networks:
      - public_net       # Côté Internet
      - private_net  # Côté Interne


  opencode: # conteneur OpenCode
    image: opencode-docker:v1 #image du conteneur
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode
    depends_on:
      - proxy
      - ollama
    networks:
      - private_net
    volumes:
      - C:/_ddm/agents/shared:/agents/shared
    ports:
      - "3000:3000"
    working_dir: /agents
    environment:
      # Proxy
      # Le trafic web passe par proxy
      - HTTP_PROXY=http://proxy:3128
      - HTTPS_PROXY=http://proxy:3128
      # Empeche l'agent de passer par le proxy pour parler à 127.0.0.1 (lui même), ollama et opencode
      - NO_PROXY=localhost,127.0.0.1,ollama,opencode
      # Adresse pour la communication interne
      - OLLAMA_BASE_URL=http://ollama:11434

      # Forcer l'utilisation de Ollama, config Json
      - |
        OPENCODE_CONFIG_CONTENT={
          "enabled_providers": ["ollama"],
          "model": "ollama/qwen2.5-coder:7b",
          "provider": {
            "ollama": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "Ollama",
              "options": {
                "baseURL": "http://ollama:11434/v1"
              },
              "models": {
                "qwen2.5-coder:7b": {
                  "name": "Qwen 2.5 Coder (7B)"
                }
              }
            }
          }
        }        

  ollama: # conteneur Ollama
    image: ollama/ollama:latest
    container_name: ollama
    networks:
      - private_net
    environment:
      - HTTP_PROXY=http://proxy:3128
      - HTTPS_PROXY=http://proxy:3128
      - NO_PROXY=localhost,127.0.0.1,opencode
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
volumes:
  ollama_data:
